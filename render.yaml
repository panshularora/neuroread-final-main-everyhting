# Render Blueprint for the NeuroRead FastAPI backend.
# Render dashboard: New > Blueprint > select this repo.
services:
  - type: web
    name: neuroread-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && (python -m spacy download en_core_web_sm || true)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional. Without it, /assistive/simplify uses the rule-based fallback.
      - key: GROQ_API_KEY
        sync: false
