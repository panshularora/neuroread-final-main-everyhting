<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroRead · Reading support for dyslexic readers</title>
    <meta name="description" content="NeuroRead simplifies dense text, reads it aloud with letter colour cues, and gives dyslexic learners short adaptive practice." />
    <meta name="theme-color" content="#FAF7F0" />
    <link rel="icon" type="image/png" href="/neuroread_logo.png" />
    <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
    <script>
      (function () {
        var theme = localStorage.getItem('theme-style');
        var root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        else root.classList.add('theme-' + (theme || 'beige'));
        if (localStorage.getItem('fontFamily') === 'dyslexic') root.classList.add('font-dyslexic');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
